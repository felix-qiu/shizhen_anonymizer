[project]
name = "shizhen-anonymizer"
version = "0.5.0"
description = "Ultrasound ROI detection, cleaning, training, evaluation, and API service"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "numpy>=1.26",
  "opencv-python>=4.9",
  "pillow>=10",
  "python-multipart>=0.0.9",
  "pyyaml>=6",
  "requests>=2.31",
  "torch>=2.2",
  "torchvision>=0.17",
  "ultralytics>=8.3",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8",
  "ruff>=0.12",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 88
target-version = "py311"
