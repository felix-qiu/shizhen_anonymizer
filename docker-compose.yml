services:
  shizhen-anonymizer:
    image: 192.168.20.32:8080/shizhen/shizhen-anonymizer:v0.0.8-prod
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shizhen-anonymizer
    restart: unless-stopped
    ports:
      - "${SHIZHEN_PORT:-8000}:8000"
    environment:
      TZ: Asia/Shanghai
      YOLO_CONFIG_DIR: /tmp/ultralytics
      MPLCONFIGDIR: /tmp/matplotlib
    volumes:
      - "${SHIZHEN_DATA_DIR:-./data}:/data"
      - "./storage:/app/storage"
      - "./logs:/app/logs"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    stop_grace_period: 30s

