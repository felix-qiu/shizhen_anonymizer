<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="数据脱敏工作台" />
    <title>数据脱敏 · Privacy Console</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <script src="/assets/app.js" defer></script>
  </head>
  <body class="min-h-screen bg-ink font-sans text-paper antialiased selection:bg-signal selection:text-ink lg:h-screen lg:overflow-hidden">
    <div class="flex min-h-screen flex-col lg:h-screen lg:min-h-0 lg:overflow-hidden">
      <header class="flex min-h-16 items-center justify-between gap-5 border-b border-white/10 bg-[#081719] px-4 sm:px-6">
        <div class="flex min-w-0 items-center gap-5">
          <a href="/" class="flex shrink-0 items-center gap-3" aria-label="数据脱敏首页">
            <span class="grid size-9 place-items-center border border-signal/45 bg-signal/5 text-signal" aria-hidden="true">
              <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3 19 6v5c0 4.7-2.8 8-7 10-4.2-2-7-5.3-7-10V6l7-3Z" />
                <path d="M9 11.5h6M10.5 14.5h3" />
              </svg>
            </span>
            <span class="hidden sm:block"><strong class="block text-sm tracking-[0.2em]">数据脱敏</strong><span class="font-mono text-[9px] tracking-[0.15em] text-mist/45">ULTRASOUND PRIVACY CONSOLE</span></span>
          </a>
          <span class="hidden border-l border-white/10 pl-5 font-mono text-[10px] tracking-[0.16em] text-signal/70 md:inline">数据脱敏工作台</span>
        </div>
        <div class="flex shrink-0 items-center gap-3 font-mono text-[10px] text-mist/60"><span id="health-dot" class="size-2 rounded-full bg-amber"></span><span id="health-text" class="hidden sm:inline">正在检查服务</span><a href="/docs" class="hidden border-l border-white/10 pl-3 hover:text-signal md:inline">API 文档 ↗</a></div>
      </header>

      <section class="flex min-h-16 flex-wrap items-center justify-between gap-3 border-b border-white/10 bg-panel px-4 py-2 sm:px-6">
        <div class="flex min-w-0 items-center gap-3">
          <label for="file-input" class="cursor-pointer border border-signal/50 bg-signal/10 px-4 py-2.5 text-xs font-semibold text-signal transition hover:bg-signal/20"><span>导入数据文件夹</span><input id="file-input" type="file" class="sr-only" accept=".jpg,.jpeg,.png,.bmp,.mp4,image/jpeg,image/png,image/bmp,video/mp4" multiple webkitdirectory directory /></label>
          <div class="min-w-0"><p id="selection-name" class="truncate text-xs text-paper/75">尚未导入数据</p><p id="selection-meta" class="mt-1 font-mono text-[9px] tracking-[0.08em] text-mist/35">支持 JPG / JPEG / PNG / BMP / MP4</p></div>
        </div>
        <div class="flex items-center gap-2">
          <button id="clear-button" type="button" disabled class="border border-white/10 px-3 py-2.5 text-xs text-mist/55 hover:border-white/25 hover:text-paper disabled:cursor-not-allowed disabled:opacity-25">清空</button>
          <button id="stop-button" type="button" class="hidden border border-amber/50 px-3 py-2.5 text-xs text-amber hover:bg-amber/10">停止</button>
          <button id="clean-current-button" type="button" disabled class="min-w-28 border border-signal/50 px-4 py-2.5 text-xs font-semibold text-signal transition hover:bg-signal/10 disabled:cursor-not-allowed disabled:border-white/10 disabled:text-mist/25">脱敏当前文件</button>
          <button id="clean-button" type="button" disabled class="min-w-28 bg-signal px-4 py-2.5 text-xs font-bold text-ink transition hover:bg-[#6be4d1] disabled:cursor-not-allowed disabled:bg-white/10 disabled:text-mist/30">全部脱敏</button>
        </div>
      </section>

      <div id="error-box" class="hidden border-b border-amber/30 bg-amber/10 px-6 py-2.5 text-xs text-amber" role="alert"></div>

      <main class="grid min-h-0 flex-1 grid-cols-1 bg-[#03090a] lg:h-0 lg:grid-cols-[minmax(0,1fr)_320px] lg:overflow-hidden">
        <section class="scan-grid relative flex min-h-[520px] min-w-0 flex-col overflow-hidden border-b border-white/10 lg:min-h-0 lg:border-r lg:border-b-0">
          <div class="relative z-10 flex min-h-12 items-center justify-between gap-4 border-b border-white/10 bg-ink/85 px-4">
            <div class="min-w-0"><p id="current-name" class="truncate text-xs font-medium text-paper/75">未选择图片</p><p id="current-path" class="mt-0.5 truncate font-mono text-[8px] tracking-[0.08em] text-mist/35">—</p></div>
            <span id="current-status" class="shrink-0 border border-white/10 px-2 py-1 font-mono text-[9px] tracking-[0.12em] text-mist/40">WAITING</span>
          </div>

          <div id="empty-view" class="relative z-10 grid min-h-0 flex-1 place-items-center p-8 text-center">
            <div><label for="file-input" class="mx-auto grid size-24 cursor-pointer place-items-center border border-dashed border-signal/30 bg-signal/5 font-mono text-2xl text-signal/50 transition hover:border-signal hover:bg-signal/10">＋</label><p class="mt-5 text-sm text-paper/60">导入超声数据文件夹</p><p class="mt-2 text-xs leading-6 text-mist/35">系统自动识别图片和 MP4，导入后即可开始脱敏</p></div>
          </div>

          <div id="single-view" class="relative z-10 hidden min-h-0 flex-1 items-center justify-center overflow-hidden bg-black/25">
            <span class="absolute top-3 left-3 z-10 bg-ink/80 px-2 py-1 font-mono text-[9px] tracking-[0.16em] text-mist/70">SOURCE</span>
            <img id="single-image" class="hidden size-full object-contain" alt="原始超声图片" /><video id="single-video" class="hidden size-full object-contain" controls muted playsinline></video>
          </div>

          <div id="compare-view" class="relative z-10 hidden min-h-0 flex-1 grid-cols-1 md:grid-cols-2">
            <figure class="relative grid min-h-64 place-items-center overflow-hidden border-b border-white/10 bg-black/25 md:border-r md:border-b-0"><span class="absolute top-3 left-3 z-10 bg-ink/80 px-2 py-1 font-mono text-[9px] tracking-[0.16em] text-mist/70">SOURCE</span><img id="compare-source-image" class="hidden size-full object-contain" alt="脱敏前超声图片" /><video id="compare-source-video" class="hidden size-full object-contain" controls muted playsinline></video></figure>
            <figure class="relative grid min-h-64 place-items-center overflow-hidden bg-black/25"><span class="absolute top-3 left-3 z-10 bg-ink/80 px-2 py-1 font-mono text-[9px] tracking-[0.16em] text-signal">CLEAN ROI</span><img id="compare-result-image" class="hidden size-full object-contain" alt="脱敏后超声图片" /><video id="compare-result-video" class="hidden size-full object-contain" controls playsinline></video><div id="result-placeholder" class="px-6 text-center"><div class="mx-auto mb-4 grid size-16 place-items-center rounded-full border border-signal/20 text-xl text-signal/30">⌁</div><p id="result-message" class="text-xs leading-6 text-mist/35">正在处理</p></div></figure>
          </div>

          <footer class="relative z-10 grid min-h-16 grid-cols-2 border-t border-white/10 bg-ink/90 sm:grid-cols-4">
            <div class="border-r border-white/10 px-4 py-3"><p class="font-mono text-[8px] tracking-[0.14em] text-mist/35">PROGRESS</p><p id="metric-progress" class="mt-1.5 font-mono text-[10px] text-paper/65">0 / 0</p></div>
            <div class="border-r border-white/10 px-4 py-3"><p class="font-mono text-[8px] tracking-[0.14em] text-mist/35">CONFIDENCE</p><p id="metric-confidence" class="mt-1.5 font-mono text-[10px] text-paper/65">—</p></div>
            <div class="border-t border-r border-white/10 px-4 py-3 sm:border-t-0"><p class="font-mono text-[8px] tracking-[0.14em] text-mist/35">ROI BBOX</p><p id="metric-bbox" class="mt-1.5 truncate font-mono text-[10px] text-paper/65">—</p></div>
            <div class="border-t border-white/10 px-4 py-3 sm:border-t-0"><a id="current-download" href="#" class="pointer-events-none font-mono text-[9px] tracking-[0.1em] text-mist/25">下载当前结果 ↓</a><p id="metric-time" class="mt-1.5 font-mono text-[9px] text-mist/40">—</p></div>
          </footer>
        </section>

        <aside class="flex min-h-[420px] min-w-0 flex-col bg-[#0a1719] lg:h-full lg:min-h-0 lg:overflow-hidden">
          <div class="border-b border-white/10 px-4 py-3"><div class="flex items-center justify-between gap-3"><span class="font-mono text-[10px] tracking-[0.18em] text-paper/70">文件列表</span><span id="file-counter" class="font-mono text-[9px] text-mist/40">0 FILES</span></div><label class="mt-3 flex items-center gap-2 border border-white/10 bg-black/20 px-3 py-2"><span class="font-mono text-[10px] text-mist/35">⌕</span><input id="file-search" type="search" class="min-w-0 flex-1 bg-transparent text-xs text-paper placeholder:text-mist/30 focus:outline-none" placeholder="搜索文件名" /></label></div>
          <div id="list-empty" class="grid min-h-0 flex-1 place-items-center px-6 text-center text-xs leading-6 text-mist/30">导入后在这里选择文件</div>
          <div id="file-list" class="hidden min-h-0 flex-1 overflow-y-auto py-1" role="listbox" aria-label="待脱敏文件列表"></div>
          <div class="flex items-center justify-between gap-3 border-t border-white/10 px-4 py-3 font-mono text-[9px] leading-5 text-mist/35"><span id="batch-summary">READY · 等待导入</span><span class="shrink-0 text-mist/25">A 上一个 · D 下一个</span></div>
        </aside>
      </main>
    </div>
  </body>
</html>
